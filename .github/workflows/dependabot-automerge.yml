name: Automerge Dependabot PRs

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  automerge:
    permissions:
      contents: write # for dependency graph & sarif    
    runs-on: ubuntu-latest
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@5251eeb0334b52a273adce4d305b5ae579b7eb26
        with:
          token: ${{ github.token }}
          minimum-age-of-pr: '3'
          blackout-periods: 'Sat,Sun,T17:00:00/T08:00:00,2025-07-18/2099-12-31'
